name: Update and Deploy AI News

on:
  push:
    branches:
      - main

  schedule:
    - cron: "23 10 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wang-axis-ai-news
  cancel-in-progress: false


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Update AI news
        run: python scripts/update_news.py

      - name: Commit updated news data
        shell: bash
        run: |
          if git diff --quiet -- data/news.json; then
            echo "No news changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/news.json
            git commit -m "chore: refresh AI news"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare website artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          mkdir -p _site/assets
          mkdir -p _site/data

          cp index.html _site/index.html
          cp index.html _site/404.html
          cp styles.css _site/styles.css
          cp app.js _site/app.js
          cp assets/logo.svg _site/assets/logo.svg
          cp data/news.json _site/data/news.json

          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site


  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    permissions:
      pages: write
      id-token: write

    steps:

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5