name: Update and Deploy AI Research Intelligence

on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: wang-axis-ai-research-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile scripts/update_news.py scripts/validate_site.py

      - name: Validate current stable site
        run: python scripts/validate_site.py

      - name: Snapshot and refresh AI research intelligence
        shell: bash
        run: |
          set -euo pipefail

          rm -rf _last_good_data
          cp -R data _last_good_data

          if python scripts/update_news.py && python scripts/validate_site.py; then
            echo "Refresh passed validation."
            rm -rf _last_good_data
          else
            echo "ERROR: refreshed data failed validation; restoring last-good data."
            rm -rf data
            mv _last_good_data data
            exit 1
          fi

      - name: Commit refreshed intelligence data safely
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data

          if git diff --cached --quiet; then
            echo "No intelligence-data changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh AI research intelligence"

          success=0
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main

            if git rebase origin/main && git push origin HEAD:main; then
              success=1
              break
            fi

            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done

          if [ "$success" -ne 1 ]; then
            echo "ERROR: unable to push refreshed data after 3 attempts"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Validate static JavaScript
        run: node --check app.js

      - name: Final pre-deploy validation
        run: python scripts/validate_site.py

      - name: Prepare website artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets

          cp index.html _site/index.html
          cp index.html _site/404.html
          cp styles.css _site/styles.css
          cp app.js _site/app.js
          cp assets/logo.svg _site/assets/logo.svg
          cp -R data _site/data
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
